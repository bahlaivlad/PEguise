# PEguise vendor reference database
# =================================
# Curated list of vendors whose identity is commonly impersonated in a PE's
# VERSIONINFO resource. This file is DATA, not code -- edit it freely.
#
# HOW TO ADD A VENDOR
# -------------------
# - id:                    stable machine key (lowercase, no spaces)
#   display_name:          human name used in reports
#   aliases:               every spelling seen in real CompanyName/ProductName
#                          fields, including trademark noise ("Microsoft(R)"),
#                          legal suffixes, and localized forms. Matching is
#                          normalized + fuzzy, so you do NOT need every case
#                          variant -- add distinct *wordings*.
#   product_names:         product brand names that, when they appear in
#                          ProductName, constitute a claim to be this vendor
#                          (ProductName "Firefox" is a Mozilla claim even though
#                          "Firefox" is not a spelling of "Mozilla"). Matched
#                          only against ProductName, never CompanyName.
#   product_patterns:      Python regexes (case-insensitive, fullmatch) that a
#                          GENUINE binary of this vendor could plausibly have as
#                          InternalName or OriginalFilename. Include the ".exe"
#                          / ".dll" suffix as optional where relevant.
#   internal_name_check:   strict | lenient
#                          strict  -> this vendor ships a small, enumerable set
#                                     of binaries; a name outside product_patterns
#                                     is real evidence.
#                          lenient -> this vendor ships thousands of binaries
#                                     (Microsoft, Google); a name outside
#                                     product_patterns is weak evidence only.
#                          When in doubt use "lenient": it scores lower and
#                          therefore produces fewer false positives.
#   almost_always_signed:  true if this vendor Authenticode-signs essentially
#                          every shipped binary. An UNSIGNED file claiming such a
#                          vendor is suspicious. Set false for vendors that ship
#                          unsigned helper binaries.
#   signer_cn_substrings:  lowercase substrings that legitimately appear in the
#                          Subject CN of this vendor's code-signing certificates.
#                          Used to avoid false positives when the signing entity
#                          is a subsidiary or legal entity whose name differs
#                          from CompanyName (e.g. CompanyName "Mozilla" signed by
#                          "Mozilla Corporation").
#   copyright_tokens:      lowercase tokens expected in LegalCopyright. Optional.
#
# Nothing here is authoritative about a vendor's real catalogue -- it is triage
# heuristics. Keep product_patterns generous; a missing pattern costs a false
# positive, an extra pattern costs only a missed weak signal.

vendors:
  - id: microsoft
    display_name: Microsoft
    aliases:
      - Microsoft
      - Microsoft Corporation
      - Microsoft Corp
      - "Microsoft(R) Corporation"
      - "Microsoft® Corporation"
      - Microsoft Windows
      - "Microsoft® Windows®"
      - Microsoft Windows Operating System
      - Microsoft Office
    product_names:
      - "Windows"
      - "Microsoft Windows Operating System"
      - "Microsoft Office"
      - "Microsoft Edge"
      - "Microsoft Visual Studio"
      - "Microsoft Defender"
      - "Microsoft Teams"
      - "OneDrive"
      - "Skype"
    internal_name_check: lenient
    almost_always_signed: true
    signer_cn_substrings:
      - microsoft
    copyright_tokens:
      - microsoft
    product_patterns:
      - '(?i)(svchost|explorer|notepad|calc|cmd|conhost|dllhost|rundll32|regsvr32)(\.exe)?'
      - '(?i)(powershell|pwsh|wscript|cscript|mshta|msiexec|wusa|wextract|taskmgr)(\.exe)?'
      - '(?i)(winlogon|lsass|services|wininit|csrss|smss|spoolsv|ctfmon|sihost)(\.exe)?'
      - '(?i)(msedge|iexplore|teams|onedrive|onedrivesetup|skype|msteams)(\.exe)?'
      - '(?i)(winword|excel|powerpnt|outlook|onenote|msaccess|mspub|visio|winproj)(\.exe)?'
      - '(?i)(vsjitdebugger|devenv|msbuild|dotnet|mscorsvw|ngen)(\.exe)?'
      - '(?i)(defender|msmpeng|mpcmdrun|nissrv|securityhealth\w*)(\.exe)?'
      - '(?i)\w+\.(dll|sys|mui|cpl|efi)'
      - '(?i)(microsoft|windows|ms)[-. _]?\w*(\.exe)?'

